<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <!-- Família retirante sobre chão rachado, sob sol forte. -->
  <rect width="560" height="560" fill="#F6E3C4"/>
  <circle cx="420" cy="140" r="78" fill="#F0A04B"/>
  <circle cx="420" cy="140" r="104" fill="none" stroke="#F0A04B" stroke-width="6" stroke-dasharray="14 18" opacity="0.6"/>

  <!-- Casa abandonada e árvore seca ao fundo -->
  <g fill="#B98A5E">
    <rect x="60" y="250" width="110" height="80"/>
    <polygon points="52,252 120,205 150,228 178,252"/>
  </g>
  <polygon points="140,215 182,250 150,250" fill="#F6E3C4"/>
  <rect x="100" y="285" width="24" height="45" fill="#7A5634"/>
  <g stroke="#6E4B2E" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M250,330 L250,245"/>
    <path d="M250,280 L222,248"/>
    <path d="M250,262 L278,232"/>
    <path d="M222,248 L210,232"/>
    <path d="M278,232 L292,224"/>
  </g>

  <!-- Chão -->
  <rect x="0" y="330" width="560" height="230" fill="#D9A86C"/>
  <g stroke="#A8743F" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30,380 L80,400 L70,440 L120,470"/>
    <path d="M80,400 L140,390 L180,420"/>
    <path d="M250,500 L300,470 L360,490 L380,530"/>
    <path d="M300,470 L310,430"/>
    <path d="M440,390 L480,420 L540,410"/>
    <path d="M480,420 L470,470 L510,500"/>
    <path d="M160,520 L200,500 L230,530"/>
  </g>

  <!-- Família, caminhando para a esquerda -->
  <g stroke-linecap="round">
    <!-- Homem com trouxa -->
    <circle cx="300" cy="300" r="17" fill="#5C3A26"/>
    <rect x="286" y="318" width="30" height="66" rx="12" fill="#3D5A80"/>
    <circle cx="326" cy="320" r="22" fill="#E9D8A6" stroke="#A8743F" stroke-width="2"/>
    <line x1="292" y1="382" x2="282" y2="430" stroke="#2B2D42" stroke-width="10"/>
    <line x1="310" y1="382" x2="318" y2="430" stroke="#2B2D42" stroke-width="10"/>
    <!-- Mulher -->
    <circle cx="378" cy="312" r="16" fill="#7B4A2E"/>
    <path d="M362,330 L394,330 L404,404 L352,404 Z" fill="#9C3D54"/>
    <line x1="370" y1="404" x2="366" y2="436" stroke="#7B4A2E" stroke-width="8"/>
    <line x1="388" y1="404" x2="394" y2="436" stroke="#7B4A2E" stroke-width="8"/>
    <line x1="398" y1="345" x2="420" y2="372" stroke="#7B4A2E" stroke-width="7"/>
    <!-- Criança pela mão -->
    <circle cx="430" cy="350" r="12" fill="#7B4A2E"/>
    <rect x="421" y="363" width="20" height="40" rx="8" fill="#E07A5F"/>
    <line x1="426" y1="402" x2="422" y2="430" stroke="#7B4A2E" stroke-width="6"/>
    <line x1="436" y1="402" x2="440" y2="430" stroke="#7B4A2E" stroke-width="6"/>
    <!-- Criança atrás, com mala -->
    <circle cx="482" cy="356" r="12" fill="#5C3A26"/>
    <rect x="473" y="369" width="20" height="38" rx="8" fill="#81B29A"/>
    <line x1="478" y1="406" x2="474" y2="432" stroke="#5C3A26" stroke-width="6"/>
    <line x1="488" y1="406" x2="492" y2="432" stroke="#5C3A26" stroke-width="6"/>
    <rect x="496" y="392" width="24" height="18" rx="3" fill="#8D6E4C"/>
  </g>
</svg>
