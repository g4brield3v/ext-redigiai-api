<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720">
  <!-- Cartaz de campanha fictícia: corrente de pessoas passando caixas numa rua alagada. -->
  <rect width="600" height="720" fill="#F3EBDD"/>
  <text x="300" y="78" text-anchor="middle" font-family="Segoe UI, Arial" font-weight="800" font-size="40" fill="#1F2A44">NINGUÉM ATRAVESSA</text>
  <text x="300" y="126" text-anchor="middle" font-family="Segoe UI, Arial" font-weight="800" font-size="40" fill="#C2452D">A ENCHENTE SOZINHO</text>

  <!-- Casas ao fundo, já com água pela metade -->
  <g fill="#B9AE9C">
    <polygon points="20,360 80,300 140,360"/>
    <rect x="32" y="360" width="96" height="90"/>
    <polygon points="230,350 300,285 370,350"/>
    <rect x="244" y="350" width="112" height="100"/>
    <polygon points="450,365 515,305 580,365"/>
    <rect x="462" y="365" width="106" height="85"/>
  </g>
  <g fill="#8E8372">
    <rect x="58" y="380" width="22" height="22"/>
    <rect x="285" y="372" width="28" height="26"/>
    <rect x="500" y="385" width="22" height="22"/>
  </g>

  <!-- Pessoas: braços erguidos passando caixas -->
  <g stroke-linecap="round">
    <!-- 1 -->
    <rect x="62" y="372" width="56" height="120" rx="24" fill="#3E6E8E"/>
    <line x1="72" y1="390" x2="58" y2="280" stroke="#8D5A3B" stroke-width="14"/>
    <line x1="108" y1="390" x2="122" y2="280" stroke="#8D5A3B" stroke-width="14"/>
    <!-- 2 -->
    <rect x="167" y="372" width="56" height="120" rx="24" fill="#D98E32"/>
    <line x1="177" y1="390" x2="165" y2="282" stroke="#F1C7A1" stroke-width="14"/>
    <line x1="213" y1="390" x2="240" y2="290" stroke="#F1C7A1" stroke-width="14"/>
    <!-- 3 -->
    <rect x="272" y="372" width="56" height="120" rx="24" fill="#6B8F4E"/>
    <line x1="282" y1="390" x2="270" y2="275" stroke="#C68A5E" stroke-width="14"/>
    <line x1="318" y1="390" x2="330" y2="275" stroke="#C68A5E" stroke-width="14"/>
    <!-- 4 -->
    <rect x="377" y="372" width="56" height="120" rx="24" fill="#A3485A"/>
    <line x1="387" y1="390" x2="362" y2="290" stroke="#5C3A26" stroke-width="14"/>
    <line x1="423" y1="390" x2="435" y2="282" stroke="#5C3A26" stroke-width="14"/>
    <!-- 5 -->
    <rect x="482" y="372" width="56" height="120" rx="24" fill="#4A5D8A"/>
    <line x1="492" y1="390" x2="478" y2="280" stroke="#E3B48C" stroke-width="14"/>
    <line x1="528" y1="390" x2="542" y2="280" stroke="#E3B48C" stroke-width="14"/>
  </g>
  <g>
    <circle cx="90" cy="345" r="25" fill="#8D5A3B"/>
    <circle cx="195" cy="345" r="25" fill="#F1C7A1"/>
    <circle cx="300" cy="345" r="25" fill="#C68A5E"/>
    <circle cx="405" cy="345" r="25" fill="#5C3A26"/>
    <circle cx="510" cy="345" r="25" fill="#E3B48C"/>
  </g>

  <!-- Caixas, de mão em mão -->
  <g stroke="#8A5A2B" stroke-width="3">
    <rect x="52" y="226" width="76" height="56" rx="4" fill="#C8935A"/>
    <rect x="190" y="242" width="70" height="52" rx="4" fill="#D4A26B"/>
    <rect x="262" y="221" width="76" height="56" rx="4" fill="#C8935A"/>
    <rect x="340" y="242" width="70" height="52" rx="4" fill="#D4A26B"/>
    <rect x="472" y="226" width="76" height="56" rx="4" fill="#C8935A"/>
  </g>
  <g stroke="#8A5A2B" stroke-width="2">
    <line x1="90" y1="226" x2="90" y2="282"/>
    <line x1="300" y1="221" x2="300" y2="277"/>
    <line x1="510" y1="226" x2="510" y2="282"/>
  </g>

  <!-- Água -->
  <path d="M0,452 C60,438 120,466 180,452 C240,438 300,466 360,452 C420,438 480,466 540,452 C570,445 590,448 600,452 L600,720 L0,720 Z" fill="#4F86B5"/>
  <path d="M0,500 C80,488 150,512 230,500 C310,488 380,512 460,500 C520,492 570,505 600,500" fill="none" stroke="#7FAAD0" stroke-width="4"/>
  <path d="M0,560 C90,548 160,572 250,560 C330,548 410,572 490,560 C540,553 580,563 600,560" fill="none" stroke="#7FAAD0" stroke-width="4"/>
  <text x="300" y="640" text-anchor="middle" font-family="Segoe UI, Arial" font-weight="700" font-size="28" fill="#FFFFFF">Doe tempo. Doe abrigo. Doe presença.</text>
</svg>
